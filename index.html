<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DynaDuck - Home</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
<header>
  <div class="header-left">
    <img src="logo.png" class="logo" onclick="window.location.href='index.html'" />
    <nav>
      <a href="catalog.html">Catalog</a>
      <a href="ideas.html">Ideas</a>
      <a href="create.html">Create</a>
      <a href="dynamites.html">Dynamites</a>
    </nav>
  </div>

  <div class="search-container">
    <input type="text" class="search-bar" placeholder="Search...">
  </div>

  <div id="authButtons">
    <button class="green-btn" onclick="window.location.href='signup.html'">Sign Up</button>
    <button class="green-btn" onclick="window.location.href='login.html'">Log In</button>
  </div>
</header>

  <main id="friendsSection">
    <h1>Friends</h1>
    <p id="friendsMessage">Loading...</p>
    <div id="gamesArea"></div>
  </main>

  <script type="module">
    import { auth, onAuthStateChanged, signOut } from "./firebase.js";
    const authButtons = document.getElementById("authButtons");
    const friendsMsg = document.getElementById("friendsMessage");
    const gamesArea = document.getElementById("gamesArea");
    const nav = document.querySelector("nav");

    const admins = ["Admin@dynaduck.com", "DinoSky@dynaduck.com", "Sheldesky@dynaduck.com"];

    onAuthStateChanged(auth, (user) => {
      if (user) {
        friendsMsg.textContent = "Welcome to DynaDuck! Explore games and add friends below:";
        gamesArea.innerHTML = `
          <div class="game-card">Game 1 (coming soon)</div>
          <div class="game-card">Game 2 (coming soon)</div>
          <div class="game-card">Game 3 (coming soon)</div>
        `;
        authButtons.innerHTML = `
          <span>Welcome, ${user.email}</span>
          <button id="logoutBtn" class="green-btn">Log Out</button>
        `;
        document.getElementById("logoutBtn").addEventListener("click", () => signOut(auth));

        if (admins.includes(user.email)) {
          const adminLink = document.createElement("a");
          adminLink.href = "admin.html";
          adminLink.textContent = "Admin Panel";
          nav.appendChild(adminLink);
        }
      } else {
        friendsMsg.textContent = "Please log in to play and see your friends.";
      }
    });
  </script>
<script type="module" src="firebase.js"></script>
<script type="module" src="auth.js"></script>

</body>
</html>
<script type="module">
import { auth } from './firebase.js';
import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const authButtonsFooter = document.getElementById("authButtonsFooter");

onAuthStateChanged(auth, (user) => {
  if (user) {
    authButtons.innerHTML = `
      <span style="color:white;font-weight:600;margin-right:10px;">Hello, ${user.email}</span>
      <button class="green-btn" id="logoutBtn">Log Out</button>
    `;
    document.getElementById("logoutBtn").addEventListener("click", async () => {
      await signOut(auth);
      window.location.reload();
    });
  } else {
    authButtons.innerHTML = `
      <button class="green-btn" onclick="location.href='signup.html'">Sign Up</button>
      <button class="green-btn" onclick="location.href='login.html'">Log In</button>
    `;
  }
});
</script>
